# The official builds (D0026). Pushing a tag `v<version>` builds every artifact, signs the macOS ones and
# publishes a GitHub Release. Running it by hand builds the same artifacts without publishing.
#
# Signing secrets live in the `release` environment and reach only the macOS build job:
#   MACOS_CERT_P12       base64 of the exported signing certificate with its private key (.p12)
#   MACOS_CERT_PASSWORD  the password chosen when exporting it
#   UPDATER_PRIVATE_KEY  the updater key that signs the app's update archive (D0027)
# and one environment variable (not secret): CORVUS_SIGN_IDENTITY, the certificate's name.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    name: macOS binaries and app
    runs-on: macos-latest
    environment: release
    timeout-minutes: 60
    env:
      CORVUS_SIGN_IDENTITY: ${{ vars.CORVUS_SIGN_IDENTITY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATER_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: rustup show
      - name: Check the tag matches the version
        if: github.ref_type == 'tag'
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "$GITHUB_REF_NAME" = "v$v" || { echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $v"; exit 1; }
      - name: Require the updater key on a tag
        if: github.ref_type == 'tag'
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "a tagged release must carry a signed update archive: set UPDATER_PRIVATE_KEY in the release environment"; exit 1; }
      - name: Import the signing certificate
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERT_P12" ] || [ -z "$CORVUS_SIGN_IDENTITY" ]; then
            if [ "$GITHUB_REF_TYPE" = tag ]; then echo "a tagged release must be signed: set the release environment's secrets"; exit 1; fi
            echo "no signing certificate configured: building unsigned (manual run)"
            echo "CORVUS_SIGN_IDENTITY=" >> "$GITHUB_ENV"
            exit 0
          fi
          kc="$RUNNER_TEMP/release.keychain-db"
          kp=$(openssl rand -hex 24)
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kp" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kp" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kp" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" login.keychain-db
      - run: make dist-clean dist-macos dist-app
      - name: Show what was signed
        run: |
          for f in target/dist/stage/*/corvus target/release/bundle/macos/Corvus.app; do
            codesign -dvv "$f" 2>&1 | grep -E '^(Identifier|Authority|Signature|flags)' || echo "unsigned: $f"
          done
      - name: Remove the keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/release.keychain-db" 2>/dev/null || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-macos
          path: |
            target/dist/*.tar.gz
            target/dist/*.zip
            target/dist/*.sig
            target/dist/latest.json
          if-no-files-found: error

  linux:
    name: Linux binary (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
      - run: make native-linux-${{ matrix.arch }} smoke-linux-${{ matrix.arch }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-linux-${{ matrix.arch }}
          path: target/dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish the GitHub Release
    if: github.ref_type == 'tag'
    needs: [macos, linux]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && test -s latest.json && sha256sum -- *.tar.gz *.zip > SHA256SUMS && cat SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.zip dist/*.sig dist/latest.json dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --title "Corvus ${GITHUB_REF_NAME#v}" --generate-notes --verify-tag
