[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
corvus-domain = { path = "crates/corvus-domain" }
corvus-core = { path = "crates/corvus-core" }
corvus-http = { path = "crates/corvus-http" }
corvus-mcp = { path = "crates/corvus-mcp" }

rusqlite = { version = "0.37", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter", "fmt"] }
clap = { version = "4", features = ["derive", "env"] }
libc = "0.2"
schemars = "1"
rmcp = { version = "3", features = ["server", "macros", "transport-io"] }
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["limit", "timeout"] }
subtle = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "sync", "macros", "signal", "net", "io-std"] }

proptest = "1"
tempfile = "3"
assert_cmd = "2"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "warn"
